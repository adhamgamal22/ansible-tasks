- name: Install and Configure Nginx
  hosts: all
  become: true

  tasks:

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Start Nginx
      ansible.builtin.systemd:
        name: nginx
        state: started

    - name: Enable Nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
